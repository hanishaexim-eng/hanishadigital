<div class="fab" role="group" aria-label="Quick contact">
  <button type="button" class="fab__btn fab__btn--primary" (click)="lead.show()">
    <span class="fab__ripple" aria-hidden="true"></span>
    <span class="fab__label">Get quote</span>
  </button>
  <a routerLink="/contact" class="fab__btn fab__btn--ghost" title="Contact page" aria-label="Open contact page">
    <app-icon name="mail" sizeClass="h-5 w-5" [decorative]="true" />
  </a>
</div>
